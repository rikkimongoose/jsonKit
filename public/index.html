<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jsonKit</title>
  <link href="style.css" rel="stylesheet">
  <link href="/modules/jsoneditor/dist/jsoneditor.min.css" rel="stylesheet">
  <link href="/modules/jquery.fancytree/dist/skin-win8/ui.fancytree.min.css" rel="stylesheet">
  <link href="/modules/jquery-ui/dist/themes/base/jquery-ui.css" rel="stylesheet" >
  <link href="/modules/toastr/build/toastr.min.css" rel="stylesheet">
  <script src="/modules/jquery/dist/jquery.min.js"></script>
  <script src="/modules/jsoneditor/dist/jsoneditor.min.js"></script>
  <script src="/modules/jquery-ui/dist/jquery-ui.min.js"></script>
  <script src="/modules/jquery.fancytree/dist/jquery.fancytree-all-deps.min.js"></script>
  <script src="/modules/jquery-validation/dist/jquery.validate.min.js"></script>
  <script src="/modules/toastr/build/toastr.min.js"></script>
  <script src="/modules/mitt/dist/mitt.umd.js"></script>
</head>
<body>

  <!-- Заголовок приложения -->
  <div class="header">
    <div class="header-block-left">
      <div id="app-title"><img id="app-logo" src="images/logo.png" /></div>
      <div id="app-version" class="version-badge">1.0</div>
    </div>
    <div id="path-display" class="header-block-right path-display">
      Source path: <span id="current-path">loading...</span>
    </div>
  </div>
  
  <!-- Контейнер с двумя колонками -->
  <div id="split-container">
    <!-- Левая колонка -->
    <div id="left" class="split-pane left-pane">
      <!-- Верхний блок с кнопками -->
      <div class="left-top">
        <div class="button-container">
          <div class="tree-toolbar fixed-size">
            <button id="refresh-tree" title="Refresh">
              <i class="icon-refresh">↻</i>
            </button>
            <input type="text" id="tree-filter" placeholder="Filter..." autocomplete="off">
          </div>
        </div>
      </div>
      <!-- Нижний блок, занимающий всё оставшееся пространство -->
      <div class="left-middle" id="file-tree"></div>
      <!-- Нижний блок с панелью кнопок -->
      <div class="left-bottom">
        <div class="button-container">
          <div class="block-left">
            <button id="btn-directory" class="icon-btn">
              <img src="/svg/folder-plus.svg" alt="folder" class="icon icon-white">
            </button>
            <button id="btn-file" class="icon-btn">
              <img src="/svg/text-plus.svg" alt="text" class="icon icon-white">
            </button>
            <button id="btn-file-rename" class="icon-btn">
              <img src="/svg/pencil-down.svg" alt="pencil" class="icon icon-white">
            </button>
            <button id="btn-file-delete" class="red-button icon-btn">
              <img src="/svg/trash.svg" alt="pencil" class="icon icon-white">
            </button>
          </div>
          <div class="block-right">
          </div>
        </div>
      </div>
    </div>

    <!-- Правая колонка -->
    <div id="right" class="split-pane right-pane">
      <!-- Верхний блок, занимающий всю доступную высоту -->
      <div id="json-editor" class="right-top">
      </div>
      <!-- Нижний блок с панелью кнопок -->
      <div class="right-bottom">
        <div class="button-container">
            <button id="save-btn" class="icon-btn">
                <img src="/svg/device-floppy.svg" alt="device-floppy" class="icon icon-white">
              </button>
            <div id="opened-file-path-display" class="header-block-right path-display">no file selected</div>
        </div>
      </div>
    </div>
  </div>
  <!-- Диалоговые окна -->
   <!-- Диалоговое окно с формой -->
   <div id="directory-dialog" title="Введите имя папки" style="display: none;">
    <form id="directory-dialog-form" class="form-dialog">
      <input type="text" name="path" id="directory-dialog-name" class="input-dialog">
    </form>
  </div>

   <!-- Диалоговое окно с формой -->
   <div id="file-dialog" title="Введите имя файла" style="display: none;">
    <form id="file-dialog-form" class="form-dialog">
      <input type="text" name="path" id="directory-dialog-name" class="input-dialog">
    </form>
  </div>

   <!-- Диалоговое окно с формой -->
   <div id="file-rename-dialog" title="Введите новое имя файла" style="display: none;">
    <form id="file-rename-dialog-form" class="form-dialog">
      <input type="text" name="path" id="file-rename-path" class="input-dialog">
    </form>
  </div>

   <!-- Диалоговое окно с формой -->
   <div id="file-delete-dialog" title="Удаление файла" style="display: none;">
    <p>Вы действительно хотите <strong>полностью</strong> удалить <span id="file-delete-fileName-static" class="path-to-remove"></span>?</p>
  </div>
  <script src="lib/jquery.fancytree.dnd.js"></script>
  <script src="lib/jquery.fancytree.edit.js"></script>
  <script src="lib/split.min.js"></script>
  <script src="log.js"></script>
  <script src="str.js"></script>
  <script src="parser.js"></script>
  <script src="wildcard.js"></script>
  <script src="executor.js"></script>
  <script src="script.js"></script>
</body>
</html>
