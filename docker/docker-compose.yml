version: "3.8"

services:
  wiregock-app:
    build: .
    volumes:
      - mockfiles:${MOCKFILES_DIR}:ro  # Go — только чтение
    environment:
      - MOCKFILES_DIR=${MOCKFILES_DIR:-/app/mockfiles}
      - PORT=${SERVER_PORT:-8080}
    ports:
      - "8080:8080"

  jsonKit:
    build: .
    command: sh -c "cd /app/jsonKit && npm start"
    volumes:
      - mockfiles:${MOCKFILES_DIR}:rw  # Node.js — чтение и запись
    environment:
      - MOCKFILES_DIR=${MOCKFILES_DIR:-/app/mockfiles}
      - PORT=3000
      - WS_PORT=3030
    ports:
      - "3000:3000"
      - "3030:3030"

  git-sync:
    image: k8s.gcr.io/git-sync:v3.6.1
    volumes:
      - mockfiles:/tmp/git:rw  # Git — полный доступ
    environment:
      GIT_REPO: "https://github.com/your/repo.git"
      GIT_BRANCH: "main"
      DEST_DIR: "/tmp/git"
      WAIT: "10"
      # Опционально: настройки пользователя Git
      GIT_SYNC_USERNAME: "your_username"
      GIT_SYNC_PASSWORD: "your_token"

volumes:
  mockfiles:  # Создаём именованный volume для конфигов